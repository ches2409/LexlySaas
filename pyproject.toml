[project]
name = "lexlysaas"
version = "0.1.0"
description = "SaaS de gestión jurídica para despachos de extranjería"
requires-python = ">=3.13"
authors = [
    {name = "Lexly Team", email = "dev@lexlysaas.com"}
]
dependencies = [
    "asyncpg>=0.31.0",
    "sqlmodel>=0.0.38",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
]

[project.scripts]
test = "pytest"
lint = "ruff check"
typecheck = "mypy tests"
format = "ruff format"
check = "ruff check && mypy backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["B", "C4", "E501"]
select = ["E", "F", "I", "UP", "B", "C4"]
extend-ignore = [
    "F401", "F821", "F841",
    "E402", "E501", "E703",
    "B008", "B904",
    "F541",
    "UP006", "UP017", "UP035", "UP045",
    "I001"
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
